[project]
name = "autocoach-backend"
version = "0.1.0"
description = "Batch processing pipeline for autocoach video analysis"
requires-python = ">=3.10"
dependencies = [
    "opencv-python",
    "numpy",
    "pupil-apriltags",
    "ultralytics", # For YOLO detections
    "scipy",
    "huggingface_hub",
    "lap>=0.5.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
