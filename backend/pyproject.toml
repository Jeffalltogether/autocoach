[project]
name = "autocoach-backend"
version = "0.1.0"
description = "Batch processing pipeline for autocoach video analysis"
requires-python = ">=3.10"
dependencies = [
    "opencv-python",
    "numpy",
    "pupil-apriltags",
    "ultralytics", # For YOLO detections
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src"]
